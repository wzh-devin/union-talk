[project]
name = "union-talk-agent"
version = "0.1.0"
description = "Union Talk 会话 Agent、流式回答与 RAG 微服务"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=10.0.1",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.13.4",
    "cryptography>=45.0.0",
    "fastapi>=0.141.1",
    "FlagEmbedding>=1.3.5",
    "greenlet>=3.2.4",
    "grpcio>=1.83.0",
    "grpcio-tools>=1.83.0",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-core>=1.5.2",
    "langgraph>=1.2.10",
    "nacos-sdk-python>=2.0.11,<3.0.0",
    "orjson>=3.11.9",
    "pdf2image>=1.17.0",
    "pillow>=11.3.0",
    "pydantic-settings>=2.14.2",
    "pymilvus>=3.0.1",
    "pypdf>=6.0.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "redis>=8.0.1",
    "sentence-transformers>=5.6.1",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.0",
]

[project.scripts]
agent-api = "union_talk_agent.bootstrap.api:main"
answer-worker = "union_talk_agent.bootstrap.answer_worker:main"
embedding-api = "union_talk_agent.bootstrap.embedding_api:main"
index-worker = "union_talk_agent.bootstrap.index_worker:main"
reconciliation-worker = "union_talk_agent.bootstrap.reconciliation_worker:main"

[dependency-groups]
dev = [
    "hatchling>=1.27.0",
    "pip",
    "pyright>=1.1.400",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/union_talk_agent"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["src/union_talk_agent/infrastructure/grpc/generated"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "UP"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["union_talk_agent"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/union_talk_agent/infrastructure/grpc/generated"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnusedFunction = false

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: 需要外部基础设施的集成测试",
    "contract: 跨服务契约测试",
]
