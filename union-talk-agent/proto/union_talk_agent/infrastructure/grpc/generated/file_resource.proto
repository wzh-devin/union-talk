syntax = "proto3";

package file.service;

message AgentResourceContentRequest {
  string asset_id = 1;
  int32 resource_version = 2;
}

message AgentResourceContent {
  string asset_id = 1;
  string conversation_id = 2;
  int32 resource_version = 3;
  string file_name = 4;
  string mime_type = 5;
  string sha256 = 6;
  string etag = 7;
  string folder_id = 8;
  string path_text = 9;
  string download_url = 10;
}

message AgentResourceContentResponse {
  BaseResponse br = 1;
  AgentResourceContent resource = 2;
}

message BaseResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
}

service FileGrpcService {
  rpc getAgentResourceContent(AgentResourceContentRequest)
      returns (AgentResourceContentResponse);
}
