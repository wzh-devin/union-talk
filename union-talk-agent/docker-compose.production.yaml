name: union-talk-agent

services:
  union-talk-agent:
    image: ${UNION_TALK_AGENT_IMAGE:?UNION_TALK_AGENT_IMAGE is required}:${UNION_TALK_AGENT_TAG:?UNION_TALK_AGENT_TAG is required}
    container_name: union-talk-agent
    pull_policy: always
    restart: unless-stopped
    init: true
    command: ["union-talk-agent"]
    env_file:
      - agent.env
    networks:
      - union-talk
    volumes:
      - ./data/huggingface:/app/.cache/huggingface:rw
    ports:
      - "${UNION_TALK_AGENT_HOST_PORT:-13007}:${AGENT_API_PORT:-13007}"
    expose:
      - "${AGENT_EMBEDDING_PORT:-13008}"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${AGENT_API_PORT:-13007}/health/ready', timeout=3)"
          &&
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${AGENT_EMBEDDING_PORT:-13008}/internal/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5

networks:
  union-talk:
    external: true
    name: union-talk
