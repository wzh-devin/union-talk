name: union-talk-file

services:
  union-talk-file:
    image: ${UNION_TALK_IMAGE_PREFIX:?UNION_TALK_IMAGE_PREFIX is required}/union-talk-file:${UNION_TALK_IMAGE_TAG:?UNION_TALK_IMAGE_TAG is required}
    pull_policy: always
    container_name: union-talk-file
    restart: unless-stopped
    init: true
    labels:
      union-talk.dependencies.external: "nacos,postgresql,redis,seata,minio"
      union-talk.dependencies.internal: "union-talk-user,union-talk-message"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m -XX:+UseG1GC}
      SERVER_PORT: "13006"
      UNION_TALK_FILE_GRPC_PORT: "19006"
      UNION_NACOS_HOST: ${UNION_NACOS_HOST:?UNION_NACOS_HOST is required}
      UNION_NACOS_PORT: ${UNION_NACOS_PORT:-8848}
      UNION_NACOS_NAMESPACE: ${UNION_NACOS_NAMESPACE:-union-talk}
      UNION_NACOS_GROUP: ${UNION_NACOS_GROUP:-DEFAULT_GROUP}
      UNION_NACOS_USERNAME: ${UNION_NACOS_USERNAME:?UNION_NACOS_USERNAME is required}
      UNION_NACOS_PASSWORD: ${UNION_NACOS_PASSWORD:?UNION_NACOS_PASSWORD is required}
      SPRING_CLOUD_NACOS_SERVER_ADDR: "${UNION_NACOS_HOST}:${UNION_NACOS_PORT:-8848}"
      SPRING_CLOUD_NACOS_USERNAME: ${UNION_NACOS_USERNAME:?UNION_NACOS_USERNAME is required}
      SPRING_CLOUD_NACOS_PASSWORD: ${UNION_NACOS_PASSWORD:?UNION_NACOS_PASSWORD is required}
      SPRING_CLOUD_NACOS_CONFIG_NAMESPACE: ${UNION_NACOS_NAMESPACE:-union-talk}
      SPRING_CLOUD_NACOS_CONFIG_GROUP: ${UNION_NACOS_GROUP:-DEFAULT_GROUP}
      SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: ${UNION_NACOS_NAMESPACE:-union-talk}
      SPRING_CLOUD_NACOS_DISCOVERY_GROUP: ${UNION_NACOS_GROUP:-DEFAULT_GROUP}
      UNION_POSTGRESQL_HOST: ${UNION_POSTGRESQL_HOST:?UNION_POSTGRESQL_HOST is required}
      UNION_POSTGRESQL_PORT: ${UNION_POSTGRESQL_PORT:-5432}
      UNION_POSTGRESQL_USERNAME: ${UNION_POSTGRESQL_USERNAME:?UNION_POSTGRESQL_USERNAME is required}
      UNION_POSTGRESQL_PASSWORD: ${UNION_POSTGRESQL_PASSWORD:?UNION_POSTGRESQL_PASSWORD is required}
      UNION_POSTGRESQL_DATABASE: ${UNION_POSTGRESQL_DATABASE:-union_talk}
      UNION_POSTGRESQL_SCHEMA: ${UNION_POSTGRESQL_SCHEMA:-public}
      UNION_REDIS_HOST: ${UNION_REDIS_HOST:?UNION_REDIS_HOST is required}
      UNION_REDIS_PORT: ${UNION_REDIS_PORT:-6379}
      UNION_REDIS_PASSWORD: ${UNION_REDIS_PASSWORD:-}
      UNION_REDIS_DATABASE: ${UNION_REDIS_DATABASE:-0}
      UNION_SEATA_HOST: ${UNION_SEATA_HOST:?UNION_SEATA_HOST is required}
      UNION_SEATA_PORT: ${UNION_SEATA_PORT:-8091}
      UNION_CRYPTO_SECRET_KEY: ${UNION_CRYPTO_SECRET_KEY:?UNION_CRYPTO_SECRET_KEY is required}
      UNION_DRUID_MONITOR_ENABLED: ${UNION_DRUID_MONITOR_ENABLED:-false}
      UNION_DRUID_MONITOR_USERNAME: ${UNION_DRUID_MONITOR_USERNAME:-admin}
      UNION_DRUID_MONITOR_PASSWORD: ${UNION_DRUID_MONITOR_PASSWORD:-change-me}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_EXPORT_URL: ${MINIO_EXPORT_URL:?MINIO_EXPORT_URL is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-union-talk}
      UNION_FILE_MAX_FILE_SIZE: ${UNION_FILE_MAX_FILE_SIZE:-5MB}
      UNION_FILE_MAX_REQUEST_SIZE: ${UNION_FILE_MAX_REQUEST_SIZE:-25MB}
      UNION_TALK_FILE_GRPC_MAX_INBOUND_MESSAGE_SIZE: ${UNION_TALK_FILE_GRPC_MAX_INBOUND_MESSAGE_SIZE:-25MB}
      UNION_LOG_PATH: /app/logs
      UNION_LOG_ROOT_LEVEL: ${UNION_LOG_ROOT_LEVEL:-INFO}
      UNION_LOG_APP_LEVEL: ${UNION_LOG_APP_LEVEL:-INFO}
      UNION_LOG_SPRING_LEVEL: ${UNION_LOG_SPRING_LEVEL:-INFO}
      UNION_LOG_HIBERNATE_LEVEL: ${UNION_LOG_HIBERNATE_LEVEL:-INFO}
      UNION_LOG_HIKARI_LEVEL: ${UNION_LOG_HIKARI_LEVEL:-INFO}
      UNION_LOG_MAX_FILE_SIZE: ${UNION_LOG_MAX_FILE_SIZE:-100MB}
      UNION_LOG_MAX_HISTORY: ${UNION_LOG_MAX_HISTORY:-30}
      UNION_LOG_TOTAL_SIZE_CAP: ${UNION_LOG_TOTAL_SIZE_CAP:-10GB}
      UNION_LOG_CLEAN_HISTORY_ON_START: ${UNION_LOG_CLEAN_HISTORY_ON_START:-true}
      UNION_LOG_ERROR_MAX_HISTORY: ${UNION_LOG_ERROR_MAX_HISTORY:-60}
      UNION_LOG_ERROR_TOTAL_SIZE_CAP: ${UNION_LOG_ERROR_TOTAL_SIZE_CAP:-5GB}
      UNION_LOG_ASYNC_QUEUE_SIZE: ${UNION_LOG_ASYNC_QUEUE_SIZE:-2048}
      UNION_ID_GENERATOR_DATACENTER_ID: ${UNION_ID_GENERATOR_DATACENTER_ID:-1}
      UNION_ID_GENERATOR_WORKER_ID: ${UNION_FILE_WORKER_ID:-6}
    expose:
      - "13006"
      - "19006"
    volumes:
      - ./data/logs/file:/app/logs
    networks:
      - union-talk

networks:
  union-talk:
    external: true
    name: union-talk
