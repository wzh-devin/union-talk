syntax = "proto3";

package message.domain.response;

import "base/base_response.proto";

option java_multiple_files = true;
option java_package = "com.devin.uniontalk.grpc.message.domain.response";

message CreatePrivateConversationResponse {
  /**
   * 基础响应.
   */
  base.BaseResponse br = 1;

  /**
   * 会话id.
   */
  string conversation_id = 2;
}
