syntax = "proto3";

package message.domain.request;

option java_multiple_files = true;
option java_outer_classname = "GetAgentConversationPermissionRequestProto";
option java_package = "com.devin.uniontalk.grpc.message.domain.request";

message GetAgentConversationPermissionRequest {
  /**
   * 会话id.
   */
  string conversation_id = 1;

  /**
   * 当前用户id.
   */
  string user_id = 2;
}
