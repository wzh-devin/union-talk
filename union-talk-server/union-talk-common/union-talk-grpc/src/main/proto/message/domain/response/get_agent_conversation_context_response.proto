syntax = "proto3";

package message.domain.response;

import "base/base_response.proto";
import "message/domain/model/agent_conversation_message.proto";

option java_multiple_files = true;
option java_outer_classname = "GetAgentConversationContextResponseProto";
option java_package = "com.devin.uniontalk.grpc.message.domain.response";

message GetAgentConversationContextResponse {
  /**
   * 基础响应.
   */
  base.BaseResponse br = 1;

  /**
   * 会话id.
   */
  string conversation_id = 2;

  /**
   * 触发消息id.
   */
  string trigger_message_id = 3;

  /**
   * 当前问题.
   */
  string question = 4;

  /**
   * 触发消息之前的最近文本消息.
   */
  repeated message.domain.model.AgentConversationMessage recent_messages = 5;

  /**
   * 当前有效会话成员id.
   */
  repeated string receiver_user_ids = 6;

  /**
   * 被引用的消息id.
   */
  string quoted_message_id = 7;

  /**
   * 当前问题明确引用的资源id.
   */
  repeated string referenced_resource_ids = 8;

  /**
   * 当前问题明确引用的资产文件id.
   */
  repeated string referenced_asset_file_ids = 9;
}
