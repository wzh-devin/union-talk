syntax = "proto3";

package message.domain.model;

option java_multiple_files = true;
option java_outer_classname = "AgentConversationMessageProto";
option java_package = "com.devin.uniontalk.grpc.message.domain.model";

message AgentConversationMessage {
  /**
   * 消息id.
   */
  string message_id = 1;

  /**
   * 发送者类型.
   */
  string sender_type = 2;

  /**
   * 发送者显示名称.
   */
  string sender_display_name = 3;

  /**
   * 文本内容.
   */
  string content = 4;

  /**
   * 创建时间毫秒时间戳.
   */
  int64 created_at_ms = 5;
}
