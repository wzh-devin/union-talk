syntax = "proto3";

package message.domain.response;

import "base/base_response.proto";

option java_multiple_files = true;
option java_package = "com.devin.uniontalk.grpc.message.domain.response";

message GetConversationAssetContextResponse {
  /**
   * 基础响应.
   */
  base.BaseResponse br = 1;

  /**
   * 会话类型.
   */
  string conversation_type = 2;

  /**
   * 群聊id，私聊为空.
   */
  string group_id = 3;

  /**
   * 操作用户是否为私聊成员.
   */
  bool private_member = 4;
}
