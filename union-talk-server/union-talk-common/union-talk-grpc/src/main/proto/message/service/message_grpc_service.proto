syntax = "proto3";

package message.service;

import "message/domain/request/create_agent_reply_request.proto";
import "message/domain/request/get_agent_conversation_context_request.proto";
import "message/domain/request/get_agent_conversation_permission_request.proto";
import "message/domain/response/create_agent_reply_response.proto";
import "message/domain/response/get_agent_conversation_context_response.proto";
import "message/domain/response/get_agent_conversation_permission_response.proto";

option java_multiple_files = true;
option java_outer_classname = "MessageGrpcServiceProto";
option java_package = "com.devin.uniontalk.grpc.message.service";

service MessageGrpcService {
  /**
   * 创建Agent正式回复.
   */
  rpc createAgentReply(message.domain.request.CreateAgentReplyRequest)
      returns (message.domain.response.CreateAgentReplyResponse);

  /**
   * 查询Agent回答使用的紧凑会话上下文.
   */
  rpc getAgentConversationContext(message.domain.request.GetAgentConversationContextRequest)
      returns (message.domain.response.GetAgentConversationContextResponse);

  /**
   * 查询当前用户的会话Agent权限.
   */
  rpc getAgentConversationPermission(message.domain.request.GetAgentConversationPermissionRequest)
      returns (message.domain.response.GetAgentConversationPermissionResponse);
}
