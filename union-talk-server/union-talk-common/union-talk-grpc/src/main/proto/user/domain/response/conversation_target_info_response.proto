syntax = "proto3";

package user.domain.response;

import "base/base_response.proto";
import "user/domain/model/conversation_group_info.proto";
import "user/domain/model/conversation_user_info.proto";

option java_multiple_files = true;
option java_package = "com.devin.uniontalk.grpc.user.domain.response";

message ConversationTargetInfoResponse {
  /**
   * 基础响应.
   */
  base.BaseResponse br = 1;

  /**
   * 用户信息列表.
   */
  repeated user.domain.model.ConversationUserInfo user_info = 2;

  /**
   * 群聊信息列表.
   */
  repeated user.domain.model.ConversationGroupInfo group_info = 3;
}
