syntax = "proto3";

package user.domain.request;

option java_multiple_files = true;
option java_package = "com.devin.uniontalk.grpc.user.domain.request";

message ConversationTargetInfoRequest {
  /**
   * 用户id列表.
   */
  repeated string user_id = 1;

  /**
   * 群聊id列表.
   */
  repeated string group_id = 2;
}
