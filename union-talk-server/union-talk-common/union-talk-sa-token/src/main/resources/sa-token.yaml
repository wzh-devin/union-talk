# Sa-Token 配置
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: Authorization
  # token 有效期（单位：秒），默认30天
  timeout: 2592000
  # token 最低活跃频率（单位：秒），超过此时间未访问则 token 过期，-1 代表不限制
  active-timeout: -1
  # 是否允许同一账号多地同时登录
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token
  is-share: true
  # token 风格（uuid / simple-uuid / random-32 / random-64 / random-128 / tik）
  token-style: random-64
  # 是否输出操作日志
  is-log: false
